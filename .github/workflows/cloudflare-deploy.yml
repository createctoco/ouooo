name: Deploy Cloudflare hybrid catalog

on:
  workflow_dispatch:
    inputs:
      skip_d1_import:
        description: 'Skip D1 migrations and catalog imports (for recovery when D1 is already healthy)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - astro.config.ts
      - wrangler.jsonc
      - migrations/**
      - src/**
      - scripts/build-d1-import.mjs
      - scripts/deploy-locales.mjs
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare-deploy.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure production D1 database
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: >-
          node --input-type=module -e "import fs from 'node:fs';
          if(!process.env.D1_DATABASE_ID) throw new Error('CLOUDFLARE_D1_DATABASE_ID is required');
          const path='wrangler.jsonc'; const value=fs.readFileSync(path,'utf8').replace('00000000-0000-0000-0000-000000000000',process.env.D1_DATABASE_ID);
          fs.writeFileSync(path,value);"
      - name: Capture D1 restore point
        if: ${{ !(github.event.inputs.skip_d1_import == 'true') }}
        run: node scripts/capture-d1-bookmark.mjs
      - name: Apply D1 migrations
        if: ${{ !(github.event.inputs.skip_d1_import == 'true') }}
        run: npx wrangler d1 migrations apply ouooo-catalog --remote
      - name: Import English catalog
        if: ${{ !(github.event.inputs.skip_d1_import == 'true') }}
        env:
          OUOOO_LOCALE: en
        run: npm run prepare:d1 && npx wrangler d1 execute ouooo-catalog --remote --file .d1/import-en.sql
      - name: Import published localized catalogs
        if: ${{ !(github.event.inputs.skip_d1_import == 'true') }}
        shell: bash
        run: |
          for catalog in src/data/i18n/*/site-catalog.json; do
            [ -f "$catalog" ] || continue
            locale="$(basename "$(dirname "$catalog")")"
            OUOOO_LOCALE="$locale" npm run prepare:d1
            npx wrangler d1 execute ouooo-catalog --remote --file ".d1/import-$locale.sql"
          done
      # Safety net: after imports, verify D1 is healthy; on failure, restore the
      # pre-import bookmark and stop so Workers are never deployed onto a broken
      # database. Runs read-only when skip_d1_import is used.
      - name: Verify D1 catalog health
        run: node scripts/verify-d1-health.mjs
      - name: Build and deploy English plus 13 language Workers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          OUOOO_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          OUOOO_SESSION_KV_ID: ${{ secrets.CLOUDFLARE_SESSION_KV_ID }}
          OUOOO_MANAGE_ROUTES: '0'
        run: npm run deploy:locales
      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: node scripts/purge-cloudflare-cache.mjs
