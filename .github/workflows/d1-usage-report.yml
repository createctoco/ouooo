name: D1 usage report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure production D1 database
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: >-
          node --input-type=module -e "import fs from 'node:fs';
          if(!process.env.D1_DATABASE_ID) throw new Error('CLOUDFLARE_D1_DATABASE_ID is required');
          const path='wrangler.jsonc'; const value=fs.readFileSync(path,'utf8').replace('00000000-0000-0000-0000-000000000000',process.env.D1_DATABASE_ID);
          fs.writeFileSync(path,value);"
      - name: Table sizes (row counts)
        run: |
          npx wrangler d1 execute ouooo-catalog --remote --command "SELECT locale, COUNT(*) AS products FROM products GROUP BY locale ORDER BY locale;"
          npx wrangler d1 execute ouooo-catalog --remote --command "SELECT COUNT(*) AS product_categories FROM product_categories;"
      - name: Cost of the monitor queries (rows read/written)
        run: |
          echo "--- monitor query 1: COUNT(*) FROM products"
          npx wrangler d1 execute ouooo-catalog --remote --command "SELECT COUNT(*) AS total FROM products;"
          echo "--- monitor query 2: COUNT(*) FROM product_categories WHERE category_slug='uncategorized'"
          npx wrangler d1 execute ouooo-catalog --remote --command "SELECT COUNT(*) AS c FROM product_categories WHERE category_slug='uncategorized';"
          echo "--- indexes on product_categories"
          npx wrangler d1 execute ouooo-catalog --remote --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND tbl_name IN ('products','product_categories');"
      - name: Cloudflare D1 analytics (last 10 days)
        run: |
          curl -s --fail-with-body https://api.cloudflare.com/client/v4/graphql \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"query\":\"query { viewer { accounts(filter: {accountTag: \\\"$CLOUDFLARE_ACCOUNT_ID\\\"}) { d1AnalyticsAdaptiveGroups(limit: 100, orderBy: [date_ASC]) { dimensions { date } sum { rowsRead rowsWritten } } } } }\"}" \
            | node --input-type=module -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const j=JSON.parse(s);const g=j?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups;if(!g){console.log('RAW:',s.slice(0,1200));return;}for(const r of g)console.log(r.dimensions.date, 'read=', r.sum.rowsRead, 'written=', r.sum.rowsWritten);}catch(e){console.log('PARSE ERR',e.message,s.slice(0,1200));}})"
