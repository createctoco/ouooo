name: Catalog sync

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of products to synchronize in this run (default 10)'
        type: number
        default: 10
  schedule:
    # 22:00 Asia/Shanghai every night (GitHub cron uses UTC; DeepSeek off-peak pricing = half cost).
    - cron: '0 14 * * *'
  push:
    branches: [main]
    paths:
      - scripts/catalog-client.mjs
      - scripts/catalog-queue-ack.mjs
      - scripts/enrich-catalog.mjs
      - scripts/build-site-catalog.mjs
      - .github/workflows/catalog-sync.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize catalog index
        env:
          MECRT_CATALOG_URL: ${{ secrets.MECRT_CATALOG_URL }}
          MECRT_CATALOG_BRIDGE_SECRET: ${{ secrets.MECRT_CATALOG_BRIDGE_SECRET }}
          MECRT_CATALOG_BATCH_SIZE: ${{ inputs.batch_size || 10 }}
          MECRT_CATALOG_RECONCILE: "true"
          MECRT_CATALOG_QUEUE_FILE: src/data/catalog-queue.json
        run: npm run sync:catalog

      - name: Validate synchronized catalog
        shell: bash
        run: |
          node --input-type=module -e "import data from './src/data/catalog-index.json' with { type: 'json' }; if (!Array.isArray(data.products) || data.total < 1 || data.total !== data.products.length) throw new Error('Invalid catalog output'); console.log('Validated products:', data.total, 'mode:', data.sync_mode, 'changed:', data.changed_products, 'queue remaining:', data.queue?.remaining);"

      - name: Rewrite catalog with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: npm run enrich:catalog

      - name: Validate enriched catalog
        shell: bash
        run: |
          node --input-type=module -e "import data from './src/data/enriched-catalog.json' with { type: 'json' }; const publicCopy = data.products?.map(({ ai, structured_data }) => ({ ai, productName: structured_data?.product?.name, productDescription: structured_data?.product?.description, faq: structured_data?.faq })); if (!Array.isArray(data.products) || data.products.length < 1 || data.products.some((item) => !item.ai?.title || !item.ai?.description || !item.structured_data?.product) || JSON.stringify(publicCopy).toLowerCase().includes('mecrt')) throw new Error('Invalid enriched catalog output or source brand leakage'); console.log('Validated products:', data.products.length, 'AI generated:', data.enrichment_summary.generated, 'reused:', data.enrichment_summary.reused, 'source fallback:', data.enrichment_summary.source_fallback);"

      - name: Prepare minimal static-site catalog
        run: npm run prepare:catalog

      - name: Validate and build static site
        run: |
          node --input-type=module -e "import data from './src/data/site-catalog.json' with { type: 'json' }; const publicCopy = data.products?.map(({ title, eyebrow, summary, description, catholicContext, categories, features, specifications, applications, faq, structuredData }) => ({ title, eyebrow, summary, description, catholicContext, categories, features, specifications, applications, faq, productName: structuredData?.product?.name, productDescription: structuredData?.product?.description })); if (!data.products?.length || data.selection?.uncovered_categories?.length || JSON.stringify(publicCopy).toLowerCase().includes('mecrt')) throw new Error('Invalid public catalog, incomplete categories, or source brand leakage');"
          npm run build

      - name: Acknowledge synchronized product batch
        env:
          MECRT_CATALOG_QUEUE_FILE: src/data/catalog-queue.json
        run: npm run ack:catalog

      - name: Format catalog state files
        run: npx prettier --write src/data/catalog-index.json src/data/catalog-queue.json src/data/site-catalog.json

      - name: Publish catalog state to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog-index.json src/data/catalog-queue.json src/data/site-catalog.json
          git diff --cached --quiet || git commit -m "Sync catalog incrementally"

          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish catalog state after $attempt attempts." >&2
              exit 1
            fi

            echo "main advanced while publishing; rebasing before retry $((attempt + 1))/5."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "Unable to publish catalog state." >&2
            exit 1
          fi

          # Point a moving tag at the exact commit we pushed so the deploy
          # dispatch can reference it without a ref-propagation race.
          git tag -f deploy-latest HEAD
          git push -f origin deploy-latest

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: ouooo-public-site-catalog
          path: src/data/site-catalog.json
          if-no-files-found: error
          retention-days: 7
      - name: Trigger multilingual catalog generation
        # Translate the newly synchronized English products into all locales.
        # Bot commits do not trigger other workflows, so dispatch it explicitly.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run "Multilingual catalog generation" --repo "${{ github.repository }}" --ref deploy-latest; then
              echo "Multilingual catalog generation dispatched on attempt $attempt."
              exit 0
            fi
            echo "Multilingual dispatch attempt $attempt failed; retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          echo "Unable to dispatch multilingual generation after 3 attempts." >&2
          exit 1